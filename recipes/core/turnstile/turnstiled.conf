# Send errors to stderr for Mere's service logs without enabling debug messages.
debug_stderr = yes

# Mere starts with runtime-directory management only. User services are opt-in.
backend = none
manage_rundir = yes
rundir_path = /run/user/%u
linger = no

# Session launchers currently start their own bus with dbus-run-session.
export_dbus_address = no
root_session = no
login_timeout = 60
